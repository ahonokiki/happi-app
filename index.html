<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>ハピ価格計算</title>
<style>
  :root {
    --pink: #ff8ec8;
    --pink-deep: #ff5fa6;
    --mint: #63d6a6;
    --mint-deep: #28b27f;
    --lav: #b89bef;
    --sky: #86d3f2;
    --ink: #7a6a90;
    --yellow: #ffd45e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: "Hiragino Maru Gothic ProN", "Quicksand", "Rounded Mplus 1c",
                 -apple-system, "メイリオ", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(ellipse 130px 60px at 18% 9%, rgba(255,255,255,.75), transparent 72%),
      radial-gradient(ellipse 150px 66px at 80% 6%, rgba(255,255,255,.65), transparent 72%),
      radial-gradient(ellipse 90px 44px at 55% 14%, rgba(255,255,255,.55), transparent 72%),
      radial-gradient(circle at 50% -5%, #b8e4fb 0%, transparent 42%),
      linear-gradient(176deg, #c9e7fb 0%, #e4d7f6 36%, #f7d6e9 64%, #d2f0e1 100%);
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 440px; padding: 0 0 24px; }

  .clover { width: 1em; height: 1em; vertical-align: -0.15em; filter: drop-shadow(0 1px 1px rgba(150,110,190,.3)); }

  /* ヘッダー */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 16px 4px;
  }
  header h1 {
    font-size: 19px; margin: 0; color: #fff; letter-spacing: .03em; font-weight: 800;
    display: flex; align-items: center; gap: 6px;
    -webkit-text-stroke: 4px #fff; paint-order: stroke fill;
    text-shadow: 0 2px 0 #ffb6d6, 0 3px 0 #ffb6d6, 0 4px 0 #ffa3cb, 0 6px 7px rgba(160,110,200,.35);
  }
  header h1 .txt { color: #ff79b3; }
  .gear {
    width: 38px; height: 38px; border-radius: 50%; border: 3px solid #fff;
    background: #fff; color: #b884e0; font-size: 19px; cursor: pointer;
    box-shadow: 0 4px 0 #e6d3f7, 0 6px 10px rgba(160,110,200,.2);
  }
  .gear:active { transform: translateY(2px); box-shadow: 0 2px 0 #e6d3f7; }

  .body { padding: 4px 14px 0; }

  /* カード */
  .card {
    position: relative; border-radius: 20px; padding: 12px 14px 13px;
    margin-bottom: 11px; border: 3px solid #fff;
    box-shadow: 0 6px 16px rgba(190,140,220,.24);
  }
  .card.toHapi { background: linear-gradient(160deg, #eafaff 0%, #f3ecff 100%); }
  .card.toYen  { background: linear-gradient(160deg, #eafff4 0%, #eef9ff 100%); }
  .card .spark { position: absolute; pointer-events: none; font-size: 15px; opacity: .85; }

  .card .tag {
    display: inline-block; font-size: 12px; font-weight: 800; color: #fff;
    padding: 4px 14px; border-radius: 999px; margin-bottom: 9px;
    -webkit-text-stroke: 0; text-shadow: 0 1px 2px rgba(120,80,160,.35);
    box-shadow: 0 3px 0 rgba(150,110,190,.18), inset 0 1.5px 0 rgba(255,255,255,.55);
  }
  .card.toHapi .tag { background: linear-gradient(120deg, #b89bef, var(--sky)); }
  .card.toYen  .tag { background: linear-gradient(120deg, var(--mint), #8fe0c4); }

  label.field-label { display: block; font-size: 12px; font-weight: 800; color: #b39ccb; margin-bottom: 4px; }
  .inputbox {
    display: flex; align-items: center; background: #fff;
    border: 3px solid #ecdcfb; border-radius: 14px; padding: 0 14px;
  }
  .inputbox:focus-within { border-color: var(--lav); }
  input.amt {
    flex: 1; border: none; outline: none; font-size: 25px; font-weight: 800;
    padding: 9px 4px; width: 100%; text-align: right; background: transparent;
    color: #6b5b80;
  }
  .inputbox .unit { font-size: 16px; color: #b39ccb; padding-left: 6px; font-weight: 800; }

  /* 結果：○○ハピ ＝ □□円（白フチ極太数字）*/
  .eq {
    margin-top: 10px; border-radius: 14px; padding: 11px 10px;
    text-align: center; line-height: 1.2; border: 2.5px solid #fff;
  }
  .card.toHapi .eq { background: linear-gradient(135deg, #bfe7fb, #e6d8fb); }
  .card.toYen  .eq { background: linear-gradient(135deg, #c6f3dd, #dff6ff); }
  .eq .line { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 2px; }
  .eq .num {
    font-weight: 800; -webkit-text-stroke: 5px #fff; paint-order: stroke fill;
  }
  .eq .num.big { font-size: 30px; }
  .eq .num.sub { font-size: 21px; }
  .card.toHapi .eq .num.big { color: var(--pink-deep);
    text-shadow: 0 2px 0 #ffaed4, 0 3px 0 #ffaed4, 0 4px 0 #ff9ac8, 0 5px 0 #ff9ac8, 0 7px 8px rgba(150,80,160,.35); }
  .card.toHapi .eq .num.sub { color: #7fb8ee; text-shadow: 0 2px 0 #c5dcff, 0 3px 0 #c5dcff; }
  .card.toYen  .eq .num.big { color: var(--mint-deep);
    text-shadow: 0 2px 0 #8fe2bf, 0 3px 0 #8fe2bf, 0 4px 0 #79dcb0, 0 5px 0 #79dcb0, 0 7px 8px rgba(80,150,120,.35); }
  .card.toYen  .eq .num.sub { color: #f0a94e; text-shadow: 0 2px 0 #ffd99a, 0 3px 0 #ffd99a; }
  .eq .u { font-size: 15px; font-weight: 800; color: #fff; margin: 0 1px 0 3px;
           -webkit-text-stroke: 0; text-shadow: 0 1px 2px rgba(120,80,160,.45); }
  .eq .u.clo { color: inherit; }
  .eq .eqsign { font-size: 26px; color: #fff; margin: 0 8px; font-weight: 800; text-shadow: 0 1px 2px rgba(120,80,160,.4); }

  /* 一発計算カードの2つの結果（マルシェ＝ピンク / RMT＝紫）*/
  .res-label { font-size: 11px; font-weight: 800; margin-bottom: 3px; }
  .eq.res-hapi .res-label { color: #e06aa6; }
  .eq.res-rmt  .res-label { color: #9b6fe0; }
  .card.toHapi .eq.res-rmt { background: linear-gradient(135deg, #e8dbfb, #f7dcf3); }
  .card.toHapi .eq.res-rmt .num.big { color: #9b6fe0;
    text-shadow: 0 2px 0 #cdb0f2, 0 3px 0 #cdb0f2, 0 4px 0 #bd9bee, 0 5px 0 #bd9bee, 0 7px 8px rgba(120,80,170,.35); }
  .card.toHapi .eq.res-rmt .num.sub { color: #c79be8; text-shadow: 0 2px 0 #e6d4fb, 0 3px 0 #e6d4fb; }
  .copy-btn.rmt { background: linear-gradient(#b89bef, #9b6fe0); box-shadow: 0 4px 0 #7d50c8; }
  .copy-btn.rmt:active { transform: translateY(2px); box-shadow: 0 2px 0 #7d50c8; }
  .clear-wide { max-width: 100% !important; margin-top: 8px; }

  .btn-row { display: flex; gap: 8px; margin-top: 10px; }
  .btn-row button {
    flex: 1; padding: 10px; font-size: 14px; border-radius: 13px; border: 2.5px solid #fff;
    cursor: pointer; font-family: inherit; font-weight: 800;
  }
  .copy-btn { color: #fff; }
  .card.toHapi .copy-btn { background: linear-gradient(var(--pink), var(--pink-deep)); box-shadow: 0 4px 0 #e24f8e; }
  .card.toYen  .copy-btn { background: linear-gradient(var(--mint), var(--mint-deep)); box-shadow: 0 4px 0 #1f9d72; }
  .card.toHapi .copy-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #e24f8e; }
  .card.toYen  .copy-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #1f9d72; }
  /* 3枚目：手取り→設定価格（ラベンダー）*/
  .card.toSet { background: linear-gradient(160deg, #f3ecff 0%, #fdeefb 100%); }
  .card.toSet .tag { background: linear-gradient(120deg, #b89bef, #d99be0); }
  .card.toSet .eq { background: linear-gradient(135deg, #e8dbfb, #f7dcf3); }
  .card.toSet .eq .num.big { color: #9b6fe0;
    text-shadow: 0 2px 0 #cdb0f2, 0 3px 0 #cdb0f2, 0 4px 0 #bd9bee, 0 5px 0 #bd9bee, 0 7px 8px rgba(120,80,170,.35); }
  .card.toSet .eq .num.sub { color: #c79be8; text-shadow: 0 2px 0 #e6d4fb, 0 3px 0 #e6d4fb; }
  .card.toSet .copy-btn { background: linear-gradient(#b89bef, #9b6fe0); box-shadow: 0 4px 0 #7d50c8; }
  .card.toSet .copy-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #7d50c8; }
  .fee-note { font-size: 12px; color: #b39ccb; text-align: center; margin-top: 8px; font-weight: 700; }

  .clear-btn {
    background: #fff; color: #b39ccb; box-shadow: 0 4px 0 #ecdcfb; max-width: 38%;
  }
  .clear-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #ecdcfb; }

  /* 履歴 */
  .histLog { padding: 6px 14px 0; }
  .histLog h2 {
    font-size: 16px; color: #fff; margin: 0 0 8px; font-weight: 800;
    display: flex; align-items: center; gap: 6px;
    -webkit-text-stroke: 3px #fff; paint-order: stroke fill;
    text-shadow: 0 2px 0 #cdb0f2, 0 3px 0 #cdb0f2, 0 4px 0 #bd9bee, 0 6px 6px rgba(160,110,200,.3);
  }
  .histLog h2 .txt { color: #b07fe0; }
  .hist-item {
    background: #fff; border-radius: 16px; padding: 10px 14px; margin-bottom: 8px;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 5px 12px rgba(190,140,220,.18); cursor: pointer; user-select: none;
    border: 2.5px solid #fff; transition: transform .15s, box-shadow .15s;
  }
  .hist-item.pressing { transform: scale(0.97); box-shadow: 0 0 0 3px var(--lav) inset; }
  .hist-left { min-width: 0; }
  .hist-date { font-size: 11px; color: #b6a6cf; margin-top: 3px; font-weight: 700; }
  .hist-eq { font-size: 16px; font-weight: 800; color: #8a78a8; }
  .hist-eq .p { color: var(--pink-deep); font-size: 18px; }
  .hist-eq .y { color: var(--mint-deep); font-size: 18px; }
  .hist-eq .s { color: #cbb8e0; margin: 0 5px; }
  .hist-tag { font-size: 11px; color: #c3b2d8; white-space: nowrap; padding-left: 10px; }
  .del-btn {
    display: none; background: linear-gradient(var(--pink), var(--pink-deep)); color: #fff;
    border: none; border-radius: 14px; padding: 9px 16px; font-size: 14px; font-weight: 800;
    cursor: pointer; font-family: inherit; box-shadow: 0 3px 0 #e24f8e;
  }
  .hist-item.show-delete .hist-tag { display: none; }
  .hist-item.show-delete .del-btn { display: inline-block; }
  .empty {
    color: #fff; font-size: 13px; text-align: center; padding: 10px 0; font-weight: 700;
    text-shadow: 0 1px 3px rgba(160,110,200,.3);
  }
  .clear-all {
    display: none; width: 100%; margin-top: 6px; padding: 12px; font-size: 13px;
    border: 2.5px solid #fff; border-radius: 16px; background: rgba(255,255,255,.55); color: #b06a9a;
    cursor: pointer; font-family: inherit; font-weight: 800;
  }
  .sync-note {
    font-size: 12px; color: #fff; text-align: center; padding: 10px 0 0; font-weight: 700;
    text-shadow: 0 1px 3px rgba(160,110,200,.3);
  }
  .ver { font-size: 11px; color: rgba(255,255,255,.8); text-align: center; padding: 14px 0 0; }

  /* モーダル */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(120,90,150,.45); z-index: 50;
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: #fff; border-radius: 28px; padding: 24px; max-width: 420px;
    width: 100%; max-height: 86vh; overflow-y: auto; border: 4px solid #f3e9fc;
    box-shadow: 0 14px 44px rgba(120,80,160,.35);
  }
  .modal h2 { font-size: 18px; margin: 0 0 4px; color: #b07fe0; font-weight: 800; }
  .modal .hint { font-size: 12px; color: #b39ccb; margin: 0 0 14px; }
  .modal label { display: block; font-size: 14px; font-weight: 800; color: #8a76a8; margin: 14px 0 6px; }
  .modal .field { display: flex; align-items: center; gap: 8px; }
  .modal .field input {
    flex: 1; padding: 12px; border: 3px solid #ecdcfb; border-radius: 16px;
    font-size: 18px; font-family: inherit; outline: none; text-align: right; color: #6b5b80; font-weight: 800;
  }
  .modal .field input:focus { border-color: var(--lav); }
  .modal .field .u { font-size: 14px; color: #b39ccb; font-weight: 800; }
  .modal .preview {
    margin-top: 16px; background: #f7f1fe; border-radius: 16px; padding: 12px;
    font-size: 13px; color: #8a76a8; text-align: center; font-weight: 800;
  }
  .modal .urlinput {
    width: 100%; padding: 12px; border: 3px solid #ecdcfb; border-radius: 16px;
    font-size: 13px; font-family: inherit; outline: none; color: #6b5b80;
  }
  .modal .urlinput:focus { border-color: var(--lav); }
  .modal hr { border: none; border-top: 2px dashed #f0e3fb; margin: 20px 0; }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .modal-actions button {
    flex: 1; padding: 15px; border-radius: 18px; font-weight: 800;
    font-family: inherit; cursor: pointer; border: none; font-size: 15px;
  }
  .modal-actions .save { background: linear-gradient(var(--mint), var(--mint-deep)); color: #fff; box-shadow: 0 4px 0 #1f9d72; }
  .modal-actions .save:active { transform: translateY(2px); box-shadow: 0 2px 0 #1f9d72; }
  .modal-actions .cancel { background: #f3ecfb; color: #b39ccb; box-shadow: 0 4px 0 #e6d6f7; }
  .modal-actions .cancel:active { transform: translateY(2px); box-shadow: 0 2px 0 #e6d6f7; }
  .reset-link {
    display: block; text-align: center; margin-top: 14px; font-size: 12px;
    color: #c3b2d8; cursor: pointer; text-decoration: underline;
  }

  #toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
    background: #9a6bc8; color: #fff; padding: 13px 24px; border-radius: 18px;
    font-size: 14px; font-weight: 800; opacity: 0; pointer-events: none;
    transition: all .25s; z-index: 100; max-width: 90%; text-align: center;
    box-shadow: 0 6px 18px rgba(120,80,160,.4); border: 2.5px solid #fff;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.err { background: var(--pink-deep); }
</style>
</head>
<body>
<!-- 四つ葉アイコン（ハピコイン）-->
<svg width="0" height="0" style="position:absolute">
  <symbol id="clover" viewBox="0 0 32 32">
    <!-- ハート4枚の四つ葉＋金フチ。対角で同色：上下=ピンク / 左右=水色 -->
    <g stroke="#f0bd45" stroke-width="2.6" stroke-linejoin="round">
      <path d="M16 16 C16 16 7 10.5 7 6.8 C7 4.2 9 3 10.8 3 C12.7 3 15.2 4.3 16 6 C16.8 4.3 19.3 3 21.2 3 C23 3 25 4.2 25 6.8 C25 10.5 16 16 16 16 Z" fill="#ff8ec6"/>
      <path d="M16 16 C16 16 7 10.5 7 6.8 C7 4.2 9 3 10.8 3 C12.7 3 15.2 4.3 16 6 C16.8 4.3 19.3 3 21.2 3 C23 3 25 4.2 25 6.8 C25 10.5 16 16 16 16 Z" fill="#ff8ec6" transform="rotate(180 16 16)"/>
      <path d="M16 16 C16 16 7 10.5 7 6.8 C7 4.2 9 3 10.8 3 C12.7 3 15.2 4.3 16 6 C16.8 4.3 19.3 3 21.2 3 C23 3 25 4.2 25 6.8 C25 10.5 16 16 16 16 Z" fill="#52d3ef" transform="rotate(90 16 16)"/>
      <path d="M16 16 C16 16 7 10.5 7 6.8 C7 4.2 9 3 10.8 3 C12.7 3 15.2 4.3 16 6 C16.8 4.3 19.3 3 21.2 3 C23 3 25 4.2 25 6.8 C25 10.5 16 16 16 16 Z" fill="#52d3ef" transform="rotate(270 16 16)"/>
    </g>
    <circle cx="16" cy="16" r="2.6" fill="#fff" opacity=".85"/>
    <ellipse cx="13" cy="7.5" rx="1.8" ry="1.1" fill="#fff" opacity=".7"/>
  </symbol>
</svg>

<div class="wrap">
  <header>
    <h1><svg class="clover"><use href="#clover"/></svg> <span class="txt">ハピ価格計算</span></h1>
    <button class="gear" id="gear" title="設定">⚙</button>
  </header>

  <div class="body">
    <!-- 手取り → ハピ＆RMT を一発計算 -->
    <div class="card toHapi">
      <span class="spark" style="top:10px;right:16px;">✨</span>
      <span class="tag">手取りから一発計算</span>
      <label class="field-label" for="amount">手取りでほしい金額（円）</label>
      <div class="inputbox">
        <input class="amt" id="amount" type="number" inputmode="numeric" placeholder="0" autocomplete="off">
        <span class="unit">円</span>
      </div>

      <!-- マルシェ（ハピ） -->
      <div class="eq res-hapi">
        <div class="res-label">マルシェ（ハピ）で売るなら</div>
        <div class="line">
          <span class="num big" id="out">0</span><span class="u clo"><svg class="clover"><use href="#clover"/></svg></span><span class="u">ハピ</span>
          <span class="eqsign">＝</span>
          <span class="u">手取り</span><span class="num sub" id="echo1">0</span><span class="u">円</span>
        </div>
      </div>

      <!-- RMT（現金） -->
      <div class="eq res-rmt">
        <div class="res-label">RMT（現金）で売るなら</div>
        <div class="line">
          <span class="num big" id="setOut">0</span><span class="u">円に設定</span>
          <span class="eqsign">＝</span>
          <span class="u">手取り</span><span class="num sub" id="netEcho">0</span><span class="u">円</span>
        </div>
        <div class="fee-note" id="fee-note"></div>
      </div>

      <div class="btn-row">
        <button class="copy-btn" id="copy1">📋 ハピをコピー</button>
        <button class="copy-btn rmt" id="copy3">📋 円をコピー</button>
      </div>
      <button class="clear-btn clear-wide" id="clear1">クリア</button>
    </div>

    <!-- ハピ → 金額 -->
    <div class="card toYen">
      <span class="spark" style="top:10px;right:16px;">✨</span>
      <span class="spark" style="bottom:54px;left:12px;font-size:12px;">✨</span>
      <span class="tag">ハピから金額を計算</span>
      <label class="field-label" for="happi">ハピ販売価格</label>
      <div class="inputbox">
        <input class="amt" id="happi" type="number" inputmode="numeric" placeholder="0" autocomplete="off">
        <span class="unit">ハピ</span>
      </div>
      <div class="eq">
        <div class="line">
          <span class="num sub" id="echo2">0</span><span class="u clo"><svg class="clover"><use href="#clover"/></svg></span><span class="u">ハピ</span>
          <span class="eqsign">＝</span>
          <span class="num big" id="out2">0</span><span class="u">円</span>
        </div>
      </div>
      <div class="btn-row">
        <button class="copy-btn" id="copy2">📋 金額をコピー</button>
        <button class="clear-btn" id="clear2">クリア</button>
      </div>
    </div>

  </div>

  <!-- 履歴 -->
  <div class="histLog">
    <h2><svg class="clover"><use href="#clover"/></svg> <span class="txt">計算履歴</span></h2>
    <div id="hist-list"><div class="empty">履歴はまだありません</div></div>
    <button class="clear-all" id="clear-all">🗑 履歴をすべて消す</button>
    <div class="sync-note" id="sync-note"></div>
    <div class="ver">ver. 16（レート自動計算）</div>
  </div>
</div>

<!-- 設定モーダル -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <h2>⚙ 計算の設定</h2>
    <p class="hint">手数料やハピのレートが変わったらここで直してください。</p>

    <label for="set-fee">マルシェ手数料（％）</label>
    <div class="field">
      <input id="set-fee" type="number" inputmode="decimal" step="0.1">
      <span class="u">％</span>
    </div>

    <label>ハピ換算レート（実際の購入例を入れてください）</label>
    <div class="field">
      <input id="set-rate-hapi" type="number" inputmode="numeric" placeholder="87000">
      <span class="u">ハピ</span>
      <span class="u" style="font-size:18px;color:#cbb8e0;">＝</span>
      <input id="set-rate-yen" type="number" inputmode="numeric" placeholder="6960">
      <span class="u">円</span>
    </div>
    <p class="hint" id="rate-calc" style="margin:6px 0 0;color:#9b6fe0;font-weight:800">→ 1円 ＝ 12.5 ハピ</p>

    <div class="preview" id="set-preview"></div>

    <hr>

    <label for="set-salefee">RMT手数料（％）<span style="font-weight:400;color:#b39ccb">／ 手取り→設定価格カード用</span></label>
    <div class="field">
      <input id="set-salefee" type="number" inputmode="decimal" step="0.1">
      <span class="u">％</span>
    </div>

    <hr>

    <label for="set-webhook">スプレッドシート連携（Webhook URL）</label>
    <p class="hint" style="margin:0 0 6px">入れると履歴と設定が全端末で共有されます。空ならこの端末だけに保存。</p>
    <input class="urlinput" id="set-webhook" type="text" placeholder="https://script.google.com/macros/s/.../exec">

    <div class="modal-actions">
      <button class="cancel" id="set-cancel">キャンセル</button>
      <button class="save" id="set-save">保存</button>
    </div>
    <span class="reset-link" id="set-reset">計算を初期値に戻す（マルシェ30％・レート12.5・RMT8.8％）</span>
  </div>
</div>

<div id="toast"></div>

<script>
  var DEFAULT_FEE = 30;     // ％（÷0.7 と同じ）
  var DEFAULT_RATE = 12.5;  // 1円 = 12.5ハピ

  // Webhookの既定値。GASのアクセスが「全員」に直るまでは空（＝端末保存のみ）にしておく。
  // 直したら下にURLを入れれば全端末共有が復活する。
  var DEFAULT_WEBHOOK = '';

  // iPhone Safari のプライベートモード等で localStorage が使えなくても落ちないようにする
  function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} }

  var DEFAULT_SALEFEE = 8.8;  // 販売手数料（％）
  var DEFAULT_RATE_HAPI = 87000, DEFAULT_RATE_YEN = 6960;  // レート入力の例（87000ハピ=6960円→12.5）

  var fee  = parseFloat(lsGet('happi_fee'))  || DEFAULT_FEE;
  var rate = parseFloat(lsGet('happi_rate')) || DEFAULT_RATE;
  var saleFee = parseFloat(lsGet('happi_salefee')); if (isNaN(saleFee)) saleFee = DEFAULT_SALEFEE;
  var webhook = lsGet('happi_webhook');
  if (webhook === null) webhook = DEFAULT_WEBHOOK;   // 一度も保存していなければ既定を使う
  var histLog;
  try { histLog = JSON.parse(lsGet('happi_history') || '[]'); } catch (e) { histLog = []; }
  if (!Array.isArray(histLog)) histLog = [];

  function divisor() { return 1 - fee / 100; }
  function fmt(n) { return Math.round(n).toLocaleString('ja-JP'); }
  function fmtNum(n) { return (Math.round(n * 100) / 100).toLocaleString('ja-JP'); }

  // ===== トースト =====
  var toastTimer = null;
  function toast(msg, isErr) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = isErr ? 'show err' : 'show';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = ''; }, 2400);
  }

  // ===== スプレッドシート連携 =====
  function postSheet(payload) {
    if (!webhook) return Promise.resolve(null);
    return fetch(webhook, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    }).then(function (r) { return r.json(); });
  }

  function fetchSheet() {
    if (!webhook) { document.getElementById('sync-note').textContent = ''; return; }
    document.getElementById('sync-note').textContent = '同期中…';
    fetch(webhook + '?action=list')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data && data.ok) {
          if (Array.isArray(data.items)) {
            if (data.items.length > 0) {
              // シートにデータあり → それを正とする
              histLog = data.items;
              lsSet('happi_history', JSON.stringify(histLog));
              renderHistory();
            } else if (histLog.length > 0) {
              // シートが空でも端末の履歴は消さない。逆にシートへ送って同期
              histLog.forEach(function (e) {
                if (e && e.id != null) {
                  postSheet({ type: 'add', id: e.id, dir: e.dir, in: e.in, out: e.out, fee: e.fee, rate: e.rate });
                }
              });
            }
          }
          // 設定も共有
          if (data.settings && data.settings.fee != null && data.settings.rate != null) {
            fee = Number(data.settings.fee);
            rate = Number(data.settings.rate);
            lsSet('happi_fee', fee);
            lsSet('happi_rate', rate);
            recalc();
          }
          document.getElementById('sync-note').textContent = '✅ スプレッドシートと同期済み';
        } else {
          document.getElementById('sync-note').textContent = '⚠ 同期エラー';
        }
      })
      .catch(function () {
        document.getElementById('sync-note').textContent = '⚠ 同期できません（この端末の履歴を表示中）';
      });
  }

  // ===== 計算 =====
  var amount = document.getElementById('amount');
  var happi = document.getElementById('happi');
  var out = document.getElementById('out');
  var out2 = document.getElementById('out2');
  var echo1 = document.getElementById('echo1');
  var echo2 = document.getElementById('echo2');
  var setOut = document.getElementById('setOut');
  var netEcho = document.getElementById('netEcho');
  var feeNote = document.getElementById('fee-note');

  function calc1() {
    var v = parseFloat(amount.value);
    if (isNaN(v)) { out.textContent = '0'; echo1.textContent = '0'; return; }
    out.textContent = fmt(v / divisor() * rate);
    echo1.textContent = fmt(v);
  }
  function calc2() {
    var v = parseFloat(happi.value);
    if (isNaN(v)) { echo2.textContent = '0'; out2.textContent = '0'; return; }
    echo2.textContent = fmt(v);
    out2.textContent = fmt(v * divisor() / rate);
  }
  // 手取り→設定価格：設定価格 = 手取り ÷ (1 − RMT手数料%)
  function setPriceOf(netYen) { return netYen / (1 - saleFee / 100); }
  function calc3() {
    var v = parseFloat(amount.value);   // 一発計算：上の入力(手取り)を共用
    if (isNaN(v)) {
      setOut.textContent = '0'; netEcho.textContent = '0';
      feeNote.textContent = 'RMT手数料 ' + fmtNum(saleFee) + '%';
      return;
    }
    var price = setPriceOf(v);
    setOut.textContent = fmt(price);
    netEcho.textContent = fmt(v);
    feeNote.textContent = 'RMT手数料 ' + fmtNum(saleFee) + '%（差し引き ' + fmt(price - v) + '円）';
  }
  function recalc() { calc1(); calc2(); calc3(); }

  // ===== 自動保存（3秒）=====
  var timer1 = null, timer2 = null;
  var lastKey = { h: null, y: null, f: null };

  function elOf(dir) { return dir === 'y' ? happi : amount; }   // h と f は同じ入力(amount)を共用
  function outOf(dir, v) {
    if (dir === 'h') return v / divisor() * rate;
    if (dir === 'y') return v * divisor() / rate;
    return setPriceOf(v);   // 'f'
  }

  function autoSave(dir) {
    var v = parseFloat(elOf(dir).value);
    if (isNaN(v) || v === 0) return;
    var key = dir + ':' + v + ':' + fee + ':' + rate + ':' + saleFee;
    if (lastKey[dir] === key) return;   // 同じ内容は重複保存しない
    lastKey[dir] = key;
    saveHistory(dir, v, outOf(dir, v));
  }

  // 入力中はリアルタイム計算のみ（上の入力はハピとRMTの両方を更新）
  amount.addEventListener('input', function () { calc1(); calc3(); });
  happi.addEventListener('input', calc2);

  // 入力を確定したら履歴に保存：PCはEnter、iPhoneはキーボードの✓（完了→change）
  amount.addEventListener('change', function () { autoSave('h'); autoSave('f'); });
  happi.addEventListener('change', function () { autoSave('y'); });
  amount.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.keyCode === 13) { autoSave('h'); autoSave('f'); amount.blur(); }
  });
  happi.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.keyCode === 13) { autoSave('y'); happi.blur(); }
  });

  document.getElementById('clear1').addEventListener('click', function () {
    amount.value = ''; calc1(); calc3(); lastKey.h = null; lastKey.f = null; amount.focus();
  });
  document.getElementById('clear2').addEventListener('click', function () {
    happi.value = ''; calc2(); lastKey.y = null; happi.focus();
  });

  // ===== コピー（押したら即履歴に保存）=====
  function copyText(txt) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(txt);
    }
    var ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    return Promise.resolve();
  }

  function copyResult(dir) {
    var v = parseFloat(elOf(dir).value);
    if (isNaN(v) || v === 0) { toast('先に数字を入れてください', true); return; }
    var outVal = outOf(dir, v);
    var unit = dir === 'h' ? 'ハピ' : '円';
    copyText(String(Math.round(outVal)))
      .then(function () { toast('📋 コピー：' + fmt(outVal) + unit); })
      .catch(function () { toast('📋 コピーしました'); });
    // コピーで即履歴に保存（クリップボードの成否に関わらず保存する）
    autoSave(dir);
  }

  document.getElementById('copy1').addEventListener('click', function () { copyResult('h'); });
  document.getElementById('copy2').addEventListener('click', function () { copyResult('y'); });
  document.getElementById('copy3').addEventListener('click', function () { copyResult('f'); });

  // ===== 履歴 =====
  function saveHistory(dir, inVal, outVal) {
    if (isNaN(inVal) || inVal === 0) return;
    var entry = { id: Date.now(), dir: dir, in: inVal, out: outVal, fee: dir === 'f' ? saleFee : fee, rate: rate };
    histLog.unshift(entry);
    if (histLog.length > 100) histLog = histLog.slice(0, 100);
    renderHistory();                               // まず画面に出す（保存が失敗しても表示は出る）
    lsSet('happi_history', JSON.stringify(histLog)); // 端末に保存（使えない環境でも落ちない）
    toast('履歴に保存しました');
    // スプレッドシート連携は裏で静かに試す（失敗しても端末には保存済みなので騒がない）
    if (webhook) {
      postSheet({ type: 'add', id: entry.id, dir: dir, in: inVal, out: outVal, fee: fee, rate: rate })
        .catch(function () {});
    }
  }

  // 日時 yyyy/mm/dd HH:MM
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function fmtDateTime(ms) {
    if (!ms) return '';
    var d = new Date(ms);
    return d.getFullYear() + '/' + pad2(d.getMonth() + 1) + '/' + pad2(d.getDate()) +
           ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }

  // 履歴1件の式 表示
  function histEqHtml(e) {
    if (e.dir === 'f') {  // 手取り→設定価格
      return '設定<span class="y">' + fmt(e.out) + '</span>円<span class="s">＝</span>' +
             '手取り<span class="p">' + fmt(e.in) + '</span>円';
    }
    var hapi = e.dir === 'h' ? e.out : e.in;
    var yen  = e.dir === 'h' ? e.in  : e.out;
    return '<span class="p">' + fmt(hapi) + '</span>ハピ<span class="s">＝</span>' +
           '<span class="y">' + fmt(yen) + '</span>円';
  }

  function renderHistory() {
    var list = document.getElementById('hist-list');
    var clearAll = document.getElementById('clear-all');
    if (histLog.length === 0) {
      list.innerHTML = '<div class="empty">履歴はまだありません</div>';
      clearAll.style.display = 'none';
      return;
    }
    clearAll.style.display = 'block';
    list.innerHTML = histLog.map(function (e, i) {
      var tag = e.dir === 'f'
        ? 'RMT手数料' + fmtNum(e.fee) + '%'
        : 'マルシェ手数料' + fmtNum(e.fee) + '% ／ ' + fmtNum(e.rate) + 'ハピ/円';
      return '<div class="hist-item" data-index="' + i + '">' +
        '<div class="hist-left">' +
          '<div class="hist-eq">' + histEqHtml(e) + '</div>' +
          '<div class="hist-date">' + fmtDateTime(e.id) + '</div>' +
        '</div>' +
        '<span class="hist-tag">' + tag + '</span>' +
        '<button class="del-btn" data-del="' + i + '">🗑 削除</button>' +
      '</div>';
    }).join('');
    attachHandlers();
  }

  function attachHandlers() {
    document.querySelectorAll('.hist-item').forEach(function (item) {
      var pressTimer = null;
      var longPressed = false;
      var idx = parseInt(item.getAttribute('data-index'), 10);

      var start = function (ev) {
        if (ev.target.classList.contains('del-btn')) return;
        longPressed = false;
        item.classList.add('pressing');
        pressTimer = setTimeout(function () {
          longPressed = true;
          item.classList.remove('pressing');
          document.querySelectorAll('.hist-item.show-delete').forEach(function (el) {
            if (el !== item) el.classList.remove('show-delete');
          });
          item.classList.toggle('show-delete');
          if (navigator.vibrate) navigator.vibrate(30);
        }, 500);
      };
      var cancel = function () { clearTimeout(pressTimer); item.classList.remove('pressing'); };

      item.addEventListener('mousedown', start);
      item.addEventListener('touchstart', start, { passive: true });
      item.addEventListener('mouseup', cancel);
      item.addEventListener('mouseleave', cancel);
      item.addEventListener('touchend', cancel);
      item.addEventListener('touchcancel', cancel);
      item.addEventListener('touchmove', cancel);

      item.addEventListener('click', function (ev) {
        if (ev.target.classList.contains('del-btn')) {
          ev.stopPropagation();
          deleteHistory(parseInt(ev.target.getAttribute('data-del'), 10));
          return;
        }
        if (longPressed) { longPressed = false; return; }
        if (item.classList.contains('show-delete')) { item.classList.remove('show-delete'); return; }
        loadHistory(idx);
      });
    });
  }

  function deleteHistory(i) {
    var removed = histLog[i];
    histLog.splice(i, 1);
    lsSet('happi_history', JSON.stringify(histLog));
    renderHistory();
    if (webhook && removed && removed.id) {
      postSheet({ type: 'delete', id: removed.id }).catch(function () {});
    }
  }

  function loadHistory(i) {
    var e = histLog[i];
    if (e.dir === 'y') {
      happi.value = e.in; calc2();
      happi.scrollIntoView({ behavior: 'smooth', block: 'center' });
    } else {
      // h（ハピ）も f（RMT）も上の手取り入力に戻す
      amount.value = e.in; calc1(); calc3();
      amount.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  document.getElementById('clear-all').addEventListener('click', function () {
    var msg = webhook ? 'スプレッドシートの履歴もすべて消しますか？' : '履歴をすべて消しますか？';
    if (!confirm(msg)) return;
    histLog = [];
    lsSet('happi_history', JSON.stringify(histLog));
    renderHistory();
    if (webhook) { postSheet({ type: 'clear' }).catch(function () {}); }
  });

  // ===== 設定モーダル =====
  var modal = document.getElementById('modal');
  var setFee = document.getElementById('set-fee');
  var setRateHapi = document.getElementById('set-rate-hapi');
  var setRateYen = document.getElementById('set-rate-yen');
  var rateCalc = document.getElementById('rate-calc');
  var setSaleFee = document.getElementById('set-salefee');
  var setWebhook = document.getElementById('set-webhook');
  var setPreview = document.getElementById('set-preview');

  // 入力された「○○ハピ＝□□円」からレート（1円=何ハピ）を求める
  function rateFromInputs() {
    var rh = parseFloat(setRateHapi.value);
    var ry = parseFloat(setRateYen.value);
    if (isNaN(rh) || isNaN(ry) || ry === 0) return NaN;
    return rh / ry;
  }
  function updatePreview() {
    var f = parseFloat(setFee.value);
    var r = rateFromInputs();
    if (isNaN(r)) { rateCalc.textContent = '→ ハピと円を入れてください'; }
    else { rateCalc.textContent = '→ 1円 ＝ ' + fmtNum(r) + ' ハピ'; }
    if (isNaN(f) || isNaN(r)) { setPreview.textContent = '数値を入れてください'; return; }
    setPreview.textContent = '希望金額 ÷ ' + fmtNum(1 - f / 100) + ' × ' + fmtNum(r) + ' ＝ ハピ販売価格';
  }
  setFee.addEventListener('input', updatePreview);
  setRateHapi.addEventListener('input', updatePreview);
  setRateYen.addEventListener('input', updatePreview);

  function openSettings() {
    setFee.value = fee;
    setRateHapi.value = parseFloat(lsGet('happi_ratehapi')) || DEFAULT_RATE_HAPI;
    setRateYen.value = parseFloat(lsGet('happi_rateyen')) || DEFAULT_RATE_YEN;
    setSaleFee.value = saleFee; setWebhook.value = webhook;
    updatePreview(); modal.classList.add('show');
  }
  function closeSettings() { modal.classList.remove('show'); }

  document.getElementById('gear').addEventListener('click', openSettings);
  document.getElementById('set-cancel').addEventListener('click', closeSettings);
  modal.addEventListener('click', function (ev) { if (ev.target === modal) closeSettings(); });

  document.getElementById('set-save').addEventListener('click', function () {
    var f = parseFloat(setFee.value);
    var rh = parseFloat(setRateHapi.value);
    var ry = parseFloat(setRateYen.value);
    var r = rateFromInputs();
    var sf = parseFloat(setSaleFee.value);
    if (isNaN(f) || isNaN(r) || r === 0 || f >= 100 || isNaN(sf) || sf >= 100) {
      alert('マルシェ手数料・RMT手数料は0〜99％、レートはハピと円を正しく入れてください。');
      return;
    }
    var feeOrRateChanged = (f !== fee || r !== rate);
    fee = f; rate = r; saleFee = sf;
    lsSet('happi_fee', fee);
    lsSet('happi_rate', rate);
    lsSet('happi_ratehapi', rh);
    lsSet('happi_rateyen', ry);
    lsSet('happi_salefee', saleFee);

    var newHook = setWebhook.value.trim();
    var hookChanged = newHook !== webhook;
    webhook = newHook;
    lsSet('happi_webhook', webhook);

    recalc();
    closeSettings();

    if (webhook && feeOrRateChanged) {
      postSheet({ type: 'save_settings', fee: fee, rate: rate }).catch(function () {});
    }
    if (hookChanged && webhook) fetchSheet();
    else if (hookChanged) document.getElementById('sync-note').textContent = '';
  });

  document.getElementById('set-reset').addEventListener('click', function () {
    setFee.value = DEFAULT_FEE;
    setRateHapi.value = DEFAULT_RATE_HAPI; setRateYen.value = DEFAULT_RATE_YEN;
    setSaleFee.value = DEFAULT_SALEFEE; updatePreview();
  });

  // ===== 初期描画 =====
  recalc();
  renderHistory();
  fetchSheet();
</script>
</body>
</html>
